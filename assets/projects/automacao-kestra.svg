<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Automação em produção</title>
  <desc id="d">Três tipos de gatilho (agenda, arquivo e mensagem) acionam um orquestrador que executa tarefas em containers, guarda estado e entrega os resultados.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8a7a5c"/></marker>
  </defs>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <rect width="640" height="360" fill="#f6f1e7"/>
    <text x="32" y="40" fill="#5b4e37" font-size="16">gatilho → orquestrador → containers → entrega</text>

    <!-- Gatilhos -->
    <g fill="#fffaf0" stroke="#b9a373" stroke-width="1.5">
      <rect x="32" y="84" width="124" height="46" rx="8"/>
      <rect x="32" y="150" width="124" height="46" rx="8"/>
      <rect x="32" y="216" width="124" height="46" rx="8"/>
    </g>
    <!-- relógio -->
    <circle cx="56" cy="107" r="10" fill="none" stroke="#a67c00" stroke-width="2"/>
    <path d="M56 101v6l4 3" stroke="#a67c00" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="76" y="112" fill="#5b4e37">agenda</text>
    <!-- arquivo -->
    <path d="M48 160h12l6 6v14H48z" fill="none" stroke="#a67c00" stroke-width="2" stroke-linejoin="round"/>
    <text x="76" y="178" fill="#5b4e37">arquivo</text>
    <!-- mensagem -->
    <path d="M46 226h20v14h-8l-5 5v-5h-7z" fill="none" stroke="#a67c00" stroke-width="2" stroke-linejoin="round"/>
    <text x="76" y="244" fill="#5b4e37">mensagem</text>

    <path d="M158 107 196 150" stroke="#8a7a5c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
    <path d="M158 173h38" stroke="#8a7a5c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
    <path d="M158 239 196 196" stroke="#8a7a5c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

    <!-- Orquestrador -->
    <rect x="200" y="100" width="150" height="146" rx="10" fill="#e6f1ea" stroke="#2f7d5b" stroke-width="2"/>
    <text x="275" y="140" text-anchor="middle" fill="#2f5d46" font-weight="700" font-size="17">orquestrador</text>
    <g fill="#dcefe5" stroke="#2f7d5b" stroke-width="1.3">
      <rect x="216" y="160" width="118" height="24" rx="6"/>
      <rect x="216" y="192" width="118" height="24" rx="6"/>
    </g>
    <text x="275" y="177" text-anchor="middle" fill="#2f5d46" font-size="13">fila · retry</text>
    <text x="275" y="209" text-anchor="middle" fill="#2f5d46" font-size="13">alerta de erro</text>

    <path d="M352 173h40" stroke="#8a7a5c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

    <!-- Containers -->
    <g fill="#e6cf94" stroke="#b8923a" stroke-width="1.5">
      <rect x="396" y="120" width="30" height="30" rx="5"/><rect x="434" y="120" width="30" height="30" rx="5"/><rect x="472" y="120" width="30" height="30" rx="5"/>
      <rect x="396" y="158" width="30" height="30" rx="5"/><rect x="434" y="158" width="30" height="30" rx="5"/><rect x="472" y="158" width="30" height="30" rx="5"/>
      <rect x="396" y="196" width="30" height="30" rx="5"/><rect x="434" y="196" width="30" height="30" rx="5"/>
    </g>
    <rect x="472" y="196" width="30" height="30" rx="5" fill="none" stroke="#b8923a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="449" y="258" text-anchor="middle" fill="#5b4e37">containers</text>

    <path d="M508 150h34" stroke="#8a7a5c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

    <!-- Entrega e estado -->
    <rect x="546" y="100" width="70" height="56" rx="8" fill="#fffaf0" stroke="#b9a373" stroke-width="1.5"/>
    <text x="581" y="133" text-anchor="middle" fill="#5b4e37" font-size="13">entrega</text>
    <path d="M508 190 546 205" stroke="#8a7a5c" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <rect x="546" y="180" width="70" height="56" rx="8" fill="#fffaf0" stroke="#b9a373" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="581" y="213" text-anchor="middle" fill="#5b4e37" font-size="13">estado</text>

    <text x="320" y="318" text-anchor="middle" fill="#5b4e37">VM na nuvem · Coolify · Docker · deploy por Git</text>
  </g>
</svg>
