# Credenciais abaixo são só para ambiente local de estudo.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dw
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw
    ports:
      - "127.0.0.1:5432:5432"   # só acessível da própria máquina (senha de estudo)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_ddl_estrela.sql:/docker-entrypoint-initdb.d/01_ddl_estrela.sql:ro  # cria o modelo na 1ª subida
      - ./sql:/sql:ro                                                               # para rodar as consultas com psql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw -d dw"]
      interval: 3s
      timeout: 3s
      retries: 20

  # SQL Server 2022 (edição Developer, gratuita para estudo). Pesa ~2 GB de RAM, então só sobe com
  # o profile: `docker compose --profile sqlserver up -d sqlserver sqlserver-init`
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Dw_Estudo_2026!
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./sql:/sql:ro   # para rodar as consultas com sqlcmd
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Cria o banco e o modelo estrela (T-SQL) uma vez e termina. Idempotente.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: Dw_Estudo_2026!
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        sqlcmd=/opt/mssql-tools18/bin/sqlcmd
        $$sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "IF DB_ID('dw') IS NULL CREATE DATABASE dw"
        $$sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -d dw -b -i /sql/sqlserver/01_ddl_estrela.sql
        echo "modelo estrela criado no SQL Server"

  # Job sob demanda: `docker compose run --rm pipeline ...` (não sobe com `up`).
  pipeline:
    build: .
    profiles: ["job"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: dw
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PASSWORD: Dw_Estudo_2026!
      SHUFFLE_PARTITIONS: "16"
    volumes:
      - ./data:/app/data
    ports:
      - "4040:4040"   # Spark UI enquanto o job roda

volumes:
  pgdata:
  sqlserver-data:
