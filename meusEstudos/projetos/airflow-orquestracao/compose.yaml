# Credenciais abaixo são só para estudo local (tudo publicado apenas em 127.0.0.1).
x-airflow-common: &airflow-common
  build: .
  image: airflow-pyspark-lab:2.10.5
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    # Código da pipeline (montado de ../pipeline-pyspark-estrela/src) e driver JDBC
    PYTHONPATH: /opt/pipeline/src
    PIPELINE_DDL: /opt/pipeline/sql/01_ddl_estrela.sql
    SHUFFLE_PARTITIONS: "8"
    # Data warehouse que a carga atualiza (serviço "dw" abaixo)
    POSTGRES_HOST: dw
    POSTGRES_PORT: "5432"
    POSTGRES_DB: dw
    POSTGRES_USER: dw
    POSTGRES_PASSWORD: dw
  volumes:
    - ./dags:/opt/airflow/dags
    - ./tests:/opt/airflow/tests
    - ../pipeline-pyspark-estrela/src:/opt/pipeline/src:ro
    - ../pipeline-pyspark-estrela/sql:/opt/pipeline/sql:ro   # DDL do modelo estrela (o incremental o usa para criar seu schema)
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  # Banco de metadados do Airflow (estado das execuções, tarefas, usuários)
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Data warehouse alvo da pipeline. Separado do banco de metadados, como em produção.
  # O DDL vem do projeto da pipeline: uma única definição do modelo estrela.
  dw:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dw
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dw-data:/var/lib/postgresql/data
      - ../pipeline-pyspark-estrela/sql/01_ddl_estrela.sql:/docker-entrypoint-initdb.d/01_ddl_estrela.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw -d dw"]
      interval: 3s
      timeout: 3s
      retries: 20

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        # só este passo tolera falha: reexecutar o init com o usuário já criado não deve quebrar
        airflow users create --username admin --password admin \
          --firstname Admin --lastname Local --role Admin --email admin@example.com \
          || echo "usuário admin já existe"
    depends_on:
      airflow-db:
        condition: service_healthy
      dw:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db-data:
  dw-data:
  airflow-logs:
